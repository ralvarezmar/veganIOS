name: VeganChecker
developmentLanguage: es
objectVersion: 56
options:
  bundleIdPrefix: com.ralvarezmar
settings:
  base:
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: VeganLens
    INFOPLIST_KEY_NSCameraUsageDescription: Necesitamos la cámara para escanear códigos de barras.
    INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Necesitamos acceder a tus fotos para adjuntarlas a una contribución.
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    PRODUCT_BUNDLE_IDENTIFIER: com.ralvarezmar.vcheck
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ENABLE_PREVIEWS: YES
targets:
  VeganChecker:
    type: application
    platform: iOS
    deploymentTarget: 17.0
    sources:
      - path: VeganChecker
    resources:
      - path: Assets.xcassets
      - path: VeganChecker/es.lproj
      - path: VeganChecker/en.lproj
      - path: VeganChecker/de.lproj
      - path: VeganChecker/fr.lproj
      - path: VeganChecker/it.lproj
      - path: VeganChecker/pt.lproj
      - path: VeganChecker/Fonts
    dependencies:
      - target: VeganCheckerWidget
        embed: true
    settings:
      base:
        PRODUCT_NAME: VCheck
        PRODUCT_MODULE_NAME: VeganChecker
        PRODUCT_BUNDLE_IDENTIFIER: com.ralvarezmar.vcheck
        SWIFT_VERSION: 5.9
        IPHONEOS_DEPLOYMENT_TARGET: 17.0
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: VeganLens
        INFOPLIST_KEY_NSCameraUsageDescription: Necesitamos la cámara para escanear códigos de barras.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Necesitamos acceder a tus fotos para adjuntarlas a una contribución.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
    info:
      path: VeganChecker/Info.plist
      properties:
        CFBundleIconName: AppIcon
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconName: AppIcon
        CFBundleIcons~ipad:
          CFBundlePrimaryIcon:
            CFBundleIconName: AppIcon
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: com.ralvarezmar.vcheck.quick-scan
            UIApplicationShortcutItemTitle: Scan
            UIApplicationShortcutItemIconSymbolName: qrcode.viewfinder
        UIAppFonts:
          - AtkinsonHyperlegible-Regular.ttf
          - AtkinsonHyperlegible-Bold.ttf
          - AtkinsonHyperlegible-Italic.ttf
          - AtkinsonHyperlegible-BoldItalic.ttf
        CFBundleURLTypes:
          - CFBundleURLName: com.ralvarezmar.vcheck
            CFBundleURLSchemes:
              - vcheck
  VeganCheckerWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: 17.0
    sources:
      - path: VeganCheckerWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ralvarezmar.vcheck.widget
        SWIFT_VERSION: 5.9
        IPHONEOS_DEPLOYMENT_TARGET: 17.0
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: VeganCheckerWidget/Info.plist
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        PRODUCT_NAME: VeganCheckerWidget
  VeganCheckerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: 17.0
    sources:
      - path: VeganCheckerTests
    dependencies:
      - target: VeganChecker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ralvarezmar.vcheck.tests
        SWIFT_VERSION: 5.9
        IPHONEOS_DEPLOYMENT_TARGET: 17.0
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/VCheck.app/VCheck
        BUNDLE_LOADER: $(TEST_HOST)
  VeganCheckerUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: 17.0
    sources:
      - path: VeganCheckerUITests
    dependencies:
      - target: VeganChecker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ralvarezmar.vcheck.uitests
        SWIFT_VERSION: 5.9
        IPHONEOS_DEPLOYMENT_TARGET: 17.0
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: VeganChecker
schemes:
  VeganChecker:
    build:
      targets:
        VeganChecker: all
    test:
      targets:
        - VeganCheckerTests
        - VeganCheckerUITests
