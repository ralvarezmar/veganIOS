name: VeganLens
developmentLanguage: es
objectVersion: 56
options:
  bundleIdPrefix: com.ralvarezmar
settings:
  base:
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: VeganLens
    INFOPLIST_KEY_NSCameraUsageDescription: Necesitamos la cámara para escanear códigos de barras o fotografiar listas de ingredientes.
    INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Necesitamos acceder a tus fotos para adjuntarlas a una contribución.
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    PRODUCT_BUNDLE_IDENTIFIER: com.ralvarezmar.vcheck
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ENABLE_PREVIEWS: YES
targets:
  VeganLens:
    type: application
    platform: iOS
    deploymentTarget: 17.0
    sources:
      - path: VeganLens
      - path: Assets.xcassets
    resources:
      - path: VeganLens/es.lproj
      - path: VeganLens/en.lproj
      - path: VeganLens/de.lproj
      - path: VeganLens/fr.lproj
      - path: VeganLens/it.lproj
      - path: VeganLens/pt.lproj
      - path: VeganLens/Fonts
    dependencies:
      - target: VeganLensWidget
        embed: true
    settings:
      base:
        PRODUCT_NAME: VeganLens
        PRODUCT_MODULE_NAME: VeganLens
        PRODUCT_BUNDLE_IDENTIFIER: com.ralvarezmar.vcheck
        SWIFT_VERSION: 5.9
        IPHONEOS_DEPLOYMENT_TARGET: 17.0
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: VeganLens
        INFOPLIST_KEY_NSCameraUsageDescription: Necesitamos la cámara para escanear códigos de barras o fotografiar listas de ingredientes.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Necesitamos acceder a tus fotos para adjuntarlas a una contribución.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        OFF_APP_USERNAME: ""
        OFF_APP_PASSWORD: ""
    info:
      path: VeganLens/Info.plist
      properties:
        OFFAppUsername: "$(OFF_APP_USERNAME)"
        OFFAppPassword: "$(OFF_APP_PASSWORD)"
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: com.ralvarezmar.vcheck.quick-scan
            UIApplicationShortcutItemTitle: Scan
            UIApplicationShortcutItemIconSymbolName: qrcode.viewfinder
        UIAppFonts:
          - AtkinsonHyperlegible-Regular.ttf
          - AtkinsonHyperlegible-Bold.ttf
          - AtkinsonHyperlegible-Italic.ttf
          - AtkinsonHyperlegible-BoldItalic.ttf
        CFBundleURLTypes:
          - CFBundleURLName: com.ralvarezmar.vcheck
            CFBundleURLSchemes:
              - vcheck
  VeganLensWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: 17.0
    sources:
      - path: VeganLensWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ralvarezmar.vcheck.widget
        SWIFT_VERSION: 5.9
        IPHONEOS_DEPLOYMENT_TARGET: 17.0
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: VeganLensWidget/Info.plist
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        PRODUCT_NAME: VeganLensWidget
  VeganLensTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: 17.0
    sources:
      - path: VeganLensTests
    resources:
      - path: VeganLensTests/Resources
    dependencies:
      - target: VeganLens
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ralvarezmar.vcheck.tests
        SWIFT_VERSION: 5.9
        IPHONEOS_DEPLOYMENT_TARGET: 17.0
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/VeganLens.app/VeganLens
        BUNDLE_LOADER: $(TEST_HOST)
  VeganLensUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: 17.0
    sources:
      - path: VeganLensUITests
    dependencies:
      - target: VeganLens
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ralvarezmar.vcheck.uitests
        SWIFT_VERSION: 5.9
        IPHONEOS_DEPLOYMENT_TARGET: 17.0
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: VeganLens
schemes:
  VeganLens:
    build:
      targets:
        VeganLens: all
    test:
      targets:
        - VeganLensTests
        - VeganLensUITests
