name: iOS Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  release:
    # macos-26 ships Xcode 26 (iOS 26 SDK), required by App Store Connect for
    # uploads. Older images (Xcode 16 / iOS 18 SDK) are rejected on validation.
    permissions:
      contents: write
    runs-on: macos-26
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
      ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
      BETA_GROUP_NAME: Pruebas
      MINIMUM_MARKETING_VERSION: "1.0.1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate semantic version
        id: calculated_version
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          dry_run: true

      - name: Resolve marketing version
        id: version
        env:
          CALCULATED_VERSION: ${{ steps.calculated_version.outputs.new_version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re

          calculated = os.environ.get("CALCULATED_VERSION", "").strip()
          minimum = os.environ["MINIMUM_MARKETING_VERSION"].strip()
          on_main = os.environ.get("GITHUB_REF") == "refs/heads/main"

          def parse(version):
              match = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", version)
              if not match:
                  raise SystemExit(f"Invalid semantic version: {version!r}")
              return tuple(int(part) for part in match.groups())

          minimum_parts = parse(minimum)
          if on_main:
              calculated_parts = parse(calculated) if calculated else minimum_parts
              final_parts = max(calculated_parts, minimum_parts)
          else:
              final_parts = (0, 0, int(os.environ["RUN_NUMBER"]))

          final_version = ".".join(str(part) for part in final_parts)
          print(
              f"Calculated version: {calculated or '<empty>'}; "
              f"minimum: {minimum}; final: {final_version}"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"name={final_version}\n")
              output.write(f"tag=v{final_version}\n")
              output.write(f"code={os.environ['RUN_NUMBER']}\n")
          PY

      - name: Create semantic tag
        id: tag_version
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          custom_tag: ${{ steps.version.outputs.tag }}

      - name: Select newest Xcode and show SDK
        run: |
          latest="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$latest" ]; then
            sudo xcode-select -s "$latest/Contents/Developer"
          fi
          xcodebuild -version
          xcodebuild -showsdks | grep -i "iphoneos" || true

      - name: Check App Store Connect credentials
        id: credentials
        run: |
          if [[ -z "$ASC_KEY_ID" || -z "$ASC_ISSUER_ID" || -z "$ASC_API_KEY_P8" ]]; then
            echo "App Store Connect secrets are not configured; skipping iOS release."
            echo "Configure ASC_KEY_ID, ASC_ISSUER_ID, and ASC_API_KEY_P8 to enable releases."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "App Store Connect credentials are configured."
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Roll CHANGELOG version
        if: steps.credentials.outputs.configured == 'true' && github.ref == 'refs/heads/main'
        env:
          VERSION_LABEL: "${{ steps.version.outputs.name }} (${{ github.run_number }})"
          VERSION_NAME: "${{ steps.version.outputs.name }}"
        run: |
          DATE="$(date +%F)"
          export DATE
          if ! python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          changelog = Path("CHANGELOG.md")
          version_label = os.environ["VERSION_LABEL"]
          release_date = os.environ["DATE"]
          contents = changelog.read_text(encoding="utf-8")
          headings = list(
              re.finditer(r"(?mi)^##\s+\[([^\]]+)\][^\r\n]*", contents)
          )
          unpublished = next(
              (
                  heading
                  for heading in headings
                  if heading.group(1).strip().lower() == "sin publicar"
              ),
              None,
          )
          if unpublished is None:
              raise RuntimeError("CHANGELOG.md has no [Sin publicar] section")

          next_heading = next(
              (heading for heading in headings if heading.start() > unpublished.start()),
              None,
          )
          body_end = next_heading.start() if next_heading else len(contents)
          body = contents[unpublished.end():body_end]
          has_changes = any(
              line.strip().startswith("- ") or line.strip().startswith("### ")
              for line in body.splitlines()
          )
          if not has_changes:
              print("No unpublished CHANGELOG changes; nothing to roll.")
          else:
              replacement = (
                  "## [Sin publicar]\n\n"
                  f"## [{version_label}] - {release_date}"
              )
              changelog.write_text(
                  contents[:unpublished.start()]
                  + replacement
                  + contents[unpublished.end():],
                  encoding="utf-8",
              )
              print(f"Rolled CHANGELOG.md to {version_label} - {release_date}")
          PY
          then
            echo "::warning::Could not roll CHANGELOG.md; continuing release."
          else
            cat > VERSION <<EOF
          MARKETING_VERSION=${VERSION_NAME}
          CURRENT_PROJECT_VERSION=${GITHUB_RUN_NUMBER}
          TAG=v${VERSION_NAME}
          EOF
          fi
          if ! git diff --quiet -- CHANGELOG.md VERSION; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add CHANGELOG.md VERSION
            if git commit -m "chore(ios): release changelog ${VERSION_LABEL} [skip ci]"; then
              pushed=false
              for attempt in 1 2 3; do
                if ! fetch_output=$(git fetch origin development 2>&1); then
                  echo "::warning::Could not fetch development before CHANGELOG push attempt ${attempt}:"
                  echo "$fetch_output"
                  break
                fi
                if ! rebase_output=$(git rebase --autostash origin/development 2>&1); then
                  git rebase --abort || true
                  echo "::warning::Could not rebase the CHANGELOG commit onto origin/development (attempt ${attempt}):"
                  echo "$rebase_output"
                  break
                fi
                if push_output=$(git push origin HEAD:development 2>&1); then
                  pushed=true
                  break
                else
                  echo "::warning::CHANGELOG push attempt ${attempt} failed:"
                  echo "$push_output"
                fi
                if [ "$attempt" -lt 3 ]; then
                  sleep $((attempt * 10))
                fi
              done
              if [ "$pushed" = true ]; then
                echo "CHANGELOG.md release commit pushed to development."
              else
                echo "::warning::Could not push the CHANGELOG release commit after 3 attempts; continuing release."
              fi
            else
              echo "::warning::Could not commit the CHANGELOG release; continuing release."
            fi
          fi

      - name: Prepare GitHub release notes
        if: steps.credentials.outputs.configured == 'true' && github.ref == 'refs/heads/main'
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION_NAME"]
          contents = Path("CHANGELOG.md").read_text(encoding="utf-8")
          headings = list(re.finditer(r"(?mi)^##\s+\[([^\]]+)\].*$", contents))
          selected = next(
              (
                  heading
                  for heading in headings
                  if heading.group(1).strip().startswith(version)
              ),
              None,
          )
          if selected is None:
              raise SystemExit(f"CHANGELOG.md has no section for {version}")
          index = headings.index(selected)
          end = headings[index + 1].start() if index + 1 < len(headings) else len(contents)
          notes = contents[selected.end():end].strip()
          if not notes:
              notes = f"Release {version}"
          Path("release-notes.md").write_text(notes + "\n", encoding="utf-8")
          print(f"Prepared GitHub release notes for {version}.")
          PY

      - name: Install XcodeGen
        if: steps.credentials.outputs.configured == 'true'
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_INSTALL_CLEANUP=1
          brew install xcodegen

      - name: Generate Xcode project
        if: steps.credentials.outputs.configured == 'true'
        run: xcodegen generate

      - name: Prepare App Store Connect API key
        if: steps.credentials.outputs.configured == 'true'
        run: |
          KEY_DIR="$RUNNER_TEMP/app-store-connect"
          KEY_PATH="$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          mkdir -p "$KEY_DIR" "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_API_KEY_P8" | base64 -D > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          cp "$KEY_PATH" "$HOME/.appstoreconnect/private_keys/"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Import distribution certificate and provisioning profiles
        if: steps.credentials.outputs.configured == 'true'
        env:
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_APP_PROFILE: ${{ secrets.IOS_APP_PROFILE }}
          IOS_WIDGET_PROFILE: ${{ secrets.IOS_WIDGET_PROFILE }}
        run: |
          set -euo pipefail
          if [[ -z "$IOS_DIST_CERT_P12" || -z "$IOS_DIST_CERT_PASSWORD" || -z "$IOS_APP_PROFILE" || -z "$IOS_WIDGET_PROFILE" ]]; then
            echo "::error::Manual signing secrets missing. Configure IOS_DIST_CERT_P12, IOS_DIST_CERT_PASSWORD, IOS_APP_PROFILE and IOS_WIDGET_PROFILE."
            exit 1
          fi

          # Create an isolated, unlocked keychain to hold the distribution identity.
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          # Keep the login keychain in the search list too so tooling still works.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN"

          CERT_P12="$RUNNER_TEMP/dist-cert.p12"
          printf '%s' "$IOS_DIST_CERT_P12" | base64 -D > "$CERT_P12"
          security import "$CERT_P12" -k "$KEYCHAIN" -P "$IOS_DIST_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Allow codesign to use the imported key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -oE '"[^"]+"' | head -n1 | tr -d '"')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::No code signing identity found in the imported .p12"
            security find-identity -v -p codesigning "$KEYCHAIN" || true
            exit 1
          fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "Signing identity: $IDENTITY"

          # Install both App Store provisioning profiles and record bundleId -> profile name.
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          : > "$RUNNER_TEMP/profile-map.txt"
          install_profile() {
            local b64="$1"
            local tmp="$RUNNER_TEMP/prof.mobileprovision"
            local plist="$RUNNER_TEMP/prof.plist"
            printf '%s' "$b64" | base64 -D > "$tmp"
            security cms -D -i "$tmp" > "$plist"
            local uuid name appid bundle
            uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$plist")"
            name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$plist")"
            appid="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$plist")"
            bundle="${appid#*.}"
            cp "$tmp" "$PROFILE_DIR/$uuid.mobileprovision"
            printf '%s=%s\n' "$bundle" "$name" >> "$RUNNER_TEMP/profile-map.txt"
            echo "Installed profile '$name' ($uuid) for bundle $bundle"
          }
          install_profile "$IOS_APP_PROFILE"
          install_profile "$IOS_WIDGET_PROFILE"

      - name: Archive app
        if: steps.credentials.outputs.configured == 'true'
        env:
          OFF_APP_USERNAME: ${{ secrets.OFF_APP_USERNAME }}
          OFF_APP_PASSWORD: ${{ secrets.OFF_APP_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -o pipefail
          # Archive without code signing; App Store (distribution) signing is
          # applied during export. Automatic signing at archive time always
          # resolves to a *development* profile (which needs registered devices)
          # and rejects a manual "Apple Distribution" override, so distribution
          # signing must happen at export.
          MARKETING_VERSION="${MARKETING_VERSION:-${VERSION_NAME}}"
          CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}"
          echo "Building version $MARKETING_VERSION ($CURRENT_PROJECT_VERSION)"
          xcodebuild archive \
            -project VeganLens.xcodeproj \
            -scheme VeganLens \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/VeganLens.xcarchive" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION" \
            OFF_APP_USERNAME="$OFF_APP_USERNAME" \
            OFF_APP_PASSWORD="$OFF_APP_PASSWORD" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee "$RUNNER_TEMP/xcodebuild-archive.log"

      - name: Surface archive failure
        if: failure()
        run: |
          log="$RUNNER_TEMP/xcodebuild-archive.log"
          if [ -f "$log" ]; then
            grep -iE "error:|provisioning|signing|cloud|development team|no profiles|certificate|no account|agreement|permission|entitlement|not been created|does not have|unable to" "$log" | tail -n 60 | while IFS= read -r line; do
              echo "::error::$line"
            done
            tail -n 30 "$log" | while IFS= read -r line; do echo "::error::TAIL: $line"; done
          else
            echo "::error::no archive log found"
          fi

      - name: Create export options
        if: steps.credentials.outputs.configured == 'true'
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict/>
          </plist>
          PLIST
          PLIST="$RUNNER_TEMP/ExportOptions.plist"
          PLISTBUDDY="/usr/libexec/PlistBuddy"
          "$PLISTBUDDY" -c "Add :destination string export" "$PLIST"
          "$PLISTBUDDY" -c "Add :method string app-store-connect" "$PLIST"
          "$PLISTBUDDY" -c "Add :signingStyle string manual" "$PLIST"
          "$PLISTBUDDY" -c "Add :signingCertificate string $SIGN_IDENTITY" "$PLIST"
          "$PLISTBUDDY" -c "Add :stripSwiftSymbols bool false" "$PLIST"
          "$PLISTBUDDY" -c "Add :uploadBitcode bool false" "$PLIST"
          if [ -n "$ASC_TEAM_ID" ]; then
            "$PLISTBUDDY" -c "Add :teamID string $ASC_TEAM_ID" "$PLIST"
          fi
          "$PLISTBUDDY" -c "Add :provisioningProfiles dict" "$PLIST"
          while IFS='=' read -r bundle name; do
            if [ -n "$bundle" ] && [ -n "$name" ]; then
              "$PLISTBUDDY" \
                -c "Add :provisioningProfiles:$bundle string $name" \
                "$PLIST"
            fi
          done < "$RUNNER_TEMP/profile-map.txt"
          cat "$PLIST"

      - name: Export archive
        if: steps.credentials.outputs.configured == 'true'
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/VeganLens.xcarchive" \
            -exportPath "$RUNNER_TEMP/VeganLens-export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tee "$RUNNER_TEMP/xcodebuild-export.log"

      - name: Surface export failure
        if: failure()
        run: |
          log="$RUNNER_TEMP/xcodebuild-export.log"
          if [ -f "$log" ]; then
            grep -iE "error:|provisioning|signing|cloud|development team|no profiles|certificate|no account|agreement|permission|entitlement|not been created|does not have|unable to" "$log" | tail -n 60 | while IFS= read -r line; do
              echo "::error::$line"
            done
            tail -n 30 "$log" | while IFS= read -r line; do echo "::error::TAIL: $line"; done
          else
            echo "::error::no export log found"
          fi

      - name: Inspect export signing
        if: steps.credentials.outputs.configured == 'true'
        run: |
          ipa="$(find "$RUNNER_TEMP/VeganLens-export" -maxdepth 1 -name '*.ipa' | head -n1)"
          work="$RUNNER_TEMP/signcheck"
          rm -rf "$work"; mkdir -p "$work"
          unzip -q "$ipa" -d "$work"
          app="$(find "$work/Payload" -maxdepth 1 -name '*.app' | head -n1)"
          echo "::error::APP $(codesign -dvvv "$app" 2>&1 | grep -iE 'Authority|TeamIdentifier|flags' | tr '\n' ' ')"
          for ax in "$app"/PlugIns/*.appex; do
            echo "::error::APPEX $(basename "$ax") $(codesign -dvvv "$ax" 2>&1 | grep -iE 'Authority|TeamIdentifier|flags' | tr '\n' ' ')"
          done
          echo "::error::EXPORTLOG $(grep -iE "widget|appex|profile|signing|distribution|apple distribution" "$RUNNER_TEMP/xcodebuild-export.log" | tail -n 25 | tr '\n' '|')"
          echo "::error::PLIST_ICONS $(plutil -p "$app/Info.plist" | grep -iE 'icon' | tr '\n' '|')"
          echo "::error::BUNDLE_FILES $(ls -1 "$app" | grep -iE 'appicon|\.car|\.png|assets' | tr '\n' '|')"
          if [ -f "$app/Assets.car" ]; then
            echo "::error::CAR_ICONS $(xcrun assetutil --info "$app/Assets.car" 2>/dev/null | grep -iE 'AppIcon|"Name"|RenditionName|SizeOnDisk' | head -n 30 | tr '\n' '|')"
          else
            echo "::error::CAR_ICONS no Assets.car in app bundle"
          fi
          echo "::error::LOOSE_ICONS $(find "$app" -maxdepth 1 -iname '*icon*' | tr '\n' '|')"

      - name: Upload to App Store Connect
        if: steps.credentials.outputs.configured == 'true'
        run: |
          set -o pipefail
          ipa="$(find "$RUNNER_TEMP/VeganLens-export" -maxdepth 1 -name '*.ipa' | head -n1)"
          echo "Uploading IPA: $ipa"
          xcrun altool \
            --upload-app \
            --file "$ipa" \
            --type ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/altool-upload.log"

      - name: Surface upload failure
        if: failure()
        run: |
          log="$RUNNER_TEMP/altool-upload.log"
          if [ -f "$log" ]; then
            tail -n 60 "$log" | while IFS= read -r line; do echo "::error::$line"; done
          else
            echo "::error::no upload log found (ipa may be missing)"
            ls -la "$RUNNER_TEMP/VeganLens-export" 2>&1 | while IFS= read -r line; do echo "::error::$line"; done
          fi

      - name: Assign build to TestFlight group
        if: steps.credentials.outputs.configured == 'true'
        run: |
          set -euo pipefail
          # Install deps; tolerate PEP 668 externally-managed Python on the runner.
          pip3 install --quiet 'pyjwt[crypto]' requests \
            || pip3 install --quiet --user 'pyjwt[crypto]' requests \
            || pip3 install --quiet --break-system-packages 'pyjwt[crypto]' requests
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import sys
          import time
          from pathlib import Path

          import jwt
          import requests

          API_BASE = "https://api.appstoreconnect.apple.com/v1"
          BUNDLE_ID = "com.ralvarezmar.vcheck"
          REQUEST_TIMEOUT = 30

          key_id = os.environ["ASC_KEY_ID"]
          issuer_id = os.environ["ASC_ISSUER_ID"]
          key_path = os.environ["ASC_KEY_PATH"]
          build_number = os.environ["GITHUB_RUN_NUMBER"]
          group_name = os.environ["BETA_GROUP_NAME"]

          def token():
              now = int(time.time())
              with open(key_path, "rb") as handle:
                  private_key = handle.read()
              return jwt.encode(
                  {
                      "iss": issuer_id,
                      "iat": now,
                      "exp": now + 15 * 60,
                      "aud": "appstoreconnect-v1",
                  },
                  private_key,
                  algorithm="ES256",
                  headers={"kid": key_id, "typ": "JWT"},
              )

          def request(method, url, fatal=True, **kwargs):
              headers = dict(kwargs.pop("headers", {}))
              headers["Authorization"] = f"Bearer {token()}"
              response = requests.request(
                  method,
                  url,
                  headers=headers,
                  timeout=REQUEST_TIMEOUT,
                  **kwargs,
              )
              if response.status_code >= 400 and fatal:
                  print(
                      f"::error::App Store Connect API {method} {url} "
                      f"returned HTTP {response.status_code}: {response.text}",
                      flush=True,
                  )
                  sys.exit(1)
              return response

          def formatted_api_errors(response):
              try:
                  payload = response.json()
              except ValueError:
                  return [response.text.strip() or "<empty response body>"]

              errors = payload.get("errors")
              if not isinstance(errors, list) or not errors:
                  return [response.text.strip() or "<empty response body>"]

              lines = []
              for index, error in enumerate(errors, start=1):
                  if not isinstance(error, dict):
                      lines.append(f"error {index}: {error}")
                      continue
                  lines.append(f"error {index}:")
                  for key in ("status", "code", "title", "detail"):
                      if error.get(key) is not None:
                          lines.append(f"  {key}: {error[key]}")
                  source = error.get("source")
                  if source is not None:
                      lines.append(f"  source: {source}")
              return lines

          def print_api_error(prefix, response, level="error"):
              print(f"::{level}::{prefix} HTTP {response.status_code}", flush=True)
              for line in formatted_api_errors(response):
                  print(f"::{level}::{line}", flush=True)

          app_response = request(
              "GET",
              f"{API_BASE}/apps",
              params={"filter[bundleId]": BUNDLE_ID},
          )
          apps = app_response.json().get("data", [])
          if not apps:
              print(
                  f"::error::No App Store Connect app found for bundle id {BUNDLE_ID}",
                  flush=True,
              )
              sys.exit(1)
          app_id = apps[0]["id"]
          print(f"Found App Store Connect app {app_id} for {BUNDLE_ID}", flush=True)

          deadline = time.monotonic() + 30 * 60
          build_id = None
          processing_state = "NOT_FOUND"
          while time.monotonic() < deadline:
              build_response = request(
                  "GET",
                  f"{API_BASE}/builds",
                  params={
                      "filter[app]": app_id,
                      "filter[version]": build_number,
                      "limit": "1",
                  },
              )
              builds = build_response.json().get("data", [])
              if builds:
                  build = builds[0]
                  build_id = build["id"]
                  processing_state = build.get("attributes", {}).get(
                      "processingState", "UNKNOWN"
                  )
                  print(
                      f"Build {build_number} ({build_id}) processing state: "
                      f"{processing_state}",
                      flush=True,
                  )
                  if processing_state == "VALID":
                      break
              else:
                  build_id = None
                  processing_state = "NOT_FOUND"
                  print(
                      f"Build {build_number} is not visible yet; retrying...",
                      flush=True,
                  )
              time.sleep(30)

          if not build_id or processing_state != "VALID":
              print(
                  "::warning::Build did not reach VALID within 30 minutes. "
                  "Assign it manually in TestFlight if needed.",
                  flush=True,
              )
              sys.exit(0)

          def git_output(*args):
              result = subprocess.run(
                  ["git", *args],
                  check=False,
                  capture_output=True,
                  text=True,
              )
              return result.stdout.strip() if result.returncode == 0 else ""

          def changelog_notes():
              changelog = Path("CHANGELOG.md")
              notes = ""
              if changelog.is_file():
                  try:
                      contents = changelog.read_text(encoding="utf-8")
                      headings = list(
                          re.finditer(
                              r"(?mi)^##\s+\[([^\]]+)\].*$",
                              contents,
                          )
                      )
                      if headings:
                          selected = next(
                              (
                                  heading
                                  for heading in headings
                                  if heading.group(1).strip().lower() != "sin publicar"
                              ),
                              None,
                          )
                          if selected is None:
                              selected = next(
                                  (
                                      heading
                                      for heading in headings
                                      if heading.group(1).strip().lower()
                                      == "sin publicar"
                                  ),
                                  None,
                              )
                          if selected is None:
                              selected = headings[0]
                          end = (
                              headings[headings.index(selected) + 1].start()
                              if selected is not headings[-1]
                              else len(contents)
                          )
                          lines = []
                          for line in contents[selected.end():end].splitlines():
                              line = line.strip()
                              if line.startswith("- "):
                                  line = "• " + line[2:].strip()
                              lines.append(line)
                          notes = "\n".join(lines).strip()
                  except Exception as error:
                      print(
                          f"::warning::Could not read CHANGELOG.md: {error}",
                          flush=True,
                      )

              if not notes:
                  last_tag = git_output("describe", "--tags", "--abbrev=0")
                  if last_tag:
                      notes = git_output(
                          "log",
                          "--pretty=format:%s",
                          f"{last_tag}..HEAD",
                      )
                  else:
                      notes = git_output(
                          "log",
                          "-n",
                          "20",
                          "--pretty=format:%s",
                      )
              if not notes:
                  notes = "Nueva compilación de prueba."
              return notes[:4000].strip()

          notes = changelog_notes()
          if not notes:
              print(
                  "::warning::Could not derive What to Test notes; skipping beta "
                  "build localizations.",
                  flush=True,
              )
          else:
              localization_url = (
                  f"{API_BASE}/builds/{build_id}/betaBuildLocalizations"
              )
              localizations_response = request(
                  "GET",
                  localization_url,
                  fatal=False,
              )
              if localizations_response.status_code >= 400:
                  print(
                      "::warning::Could not list beta build localizations: "
                      f"HTTP {localizations_response.status_code}: "
                      f"{localizations_response.text}",
                      flush=True,
                  )
              else:
                  localizations = localizations_response.json().get("data", [])
                  for locale in ("es-ES", "en-US"):
                      existing = next(
                          (
                              localization
                              for localization in localizations
                              if localization.get("attributes", {}).get("locale")
                              == locale
                          ),
                          None,
                      )
                      if existing:
                          method = "PATCH"
                          url = (
                              f"{API_BASE}/betaBuildLocalizations/"
                              f"{existing['id']}"
                          )
                          payload = {
                              "data": {
                                  "type": "betaBuildLocalizations",
                                  "id": existing["id"],
                                  "attributes": {"whatsNew": notes},
                              }
                          }
                      else:
                          method = "POST"
                          url = f"{API_BASE}/betaBuildLocalizations"
                          payload = {
                              "data": {
                                  "type": "betaBuildLocalizations",
                                  "attributes": {
                                      "locale": locale,
                                      "whatsNew": notes,
                                  },
                                  "relationships": {
                                      "build": {
                                          "data": {
                                              "type": "builds",
                                              "id": build_id,
                                          }
                                      }
                                  },
                              }
                          }
                      update_response = request(
                          method,
                          url,
                          fatal=False,
                          headers={"Content-Type": "application/json"},
                          json=payload,
                      )
                      if update_response.status_code in (200, 201, 204):
                          print(
                              f"Set What to Test notes for locale {locale}.",
                              flush=True,
                          )
                      else:
                          print(
                              f"::warning::Could not set What to Test notes for "
                              f"{locale}: HTTP {update_response.status_code}: "
                              f"{update_response.text}",
                              flush=True,
                          )

          groups_response = request(
              "GET",
              f"{API_BASE}/betaGroups",
              params={"filter[app]": app_id},
          )
          groups = groups_response.json().get("data", [])
          matching_group = next(
              (
                  group
                  for group in groups
                  if group.get("attributes", {}).get("name") == group_name
              ),
              None,
          )
          if matching_group is None:
              available = [
                  group.get("attributes", {}).get("name", "<unnamed>")
                  for group in groups
              ]
              print(
                  f"::error::TestFlight beta group '{group_name}' was not found. "
                  f"Existing groups: {', '.join(available) or '<none>'}",
                  flush=True,
              )
              sys.exit(1)

          group_attributes = matching_group.get("attributes", {})
          if group_attributes.get("isInternalGroup") is True:
              print(
                  f"::notice::TestFlight group '{group_name}' is an internal "
                  "group. Internal testers automatically receive all builds, "
                  "so no explicit build assignment is needed. To distribute "
                  "to external testers, create an external group and set "
                  "BETA_GROUP_NAME to that group.",
                  flush=True,
              )
              sys.exit(0)

          group_id = matching_group["id"]
          relationship_url = f"{API_BASE}/betaGroups/{group_id}/relationships/builds"
          relationship_body = {
              "data": [{"type": "builds", "id": build_id}],
          }
          retry_delays = (15, 30, 45, 60)
          for attempt in range(1, len(retry_delays) + 2):
              response = requests.post(
                  relationship_url,
                  headers={
                      "Authorization": f"Bearer {token()}",
                      "Content-Type": "application/json",
                  },
                  json=relationship_body,
                  timeout=REQUEST_TIMEOUT,
              )
              if response.status_code == 204:
                  print(
                      f"Build {build_number} assigned to TestFlight group "
                      f"'{group_name}'.",
                      flush=True,
                  )
                  sys.exit(0)

              normalized_body = response.text.lower()
              if response.status_code == 409 or (
                  response.status_code == 400
                  and any(
                      marker in normalized_body
                      for marker in ("already", "assigned", "in the group")
                  )
              ):
                  print(
                      f"Build {build_number} is already assigned to TestFlight "
                      f"group '{group_name}'.",
                      flush=True,
                  )
                  sys.exit(0)

              retryable = response.status_code == 429 or response.status_code >= 500
              if retryable:
                  print_api_error(
                      f"App Store Connect API POST {relationship_url} "
                      f"attempt {attempt}/{len(retry_delays) + 1}:",
                      response,
                  )
                  if attempt <= len(retry_delays):
                      time.sleep(retry_delays[attempt - 1])
                      continue
                  print(
                      "::warning::The build was uploaded to App Store Connect "
                      "but could not be assigned to the TestFlight group "
                      f"'{group_name}' after {attempt} attempts. Assign it "
                      "manually in TestFlight.",
                      flush=True,
                  )
                  sys.exit(0)

              if response.status_code == 422:
                  print_api_error(
                      f"App Store Connect API POST {relationship_url}:",
                      response,
                  )
                  print(
                      "::warning::The build was uploaded to App Store Connect "
                      "but could not be assigned to the external TestFlight "
                      f"group '{group_name}'. The 422 response indicates a "
                      "non-transient assignment restriction. Assign it "
                      "manually in TestFlight or review the group configuration.",
                      flush=True,
                  )
                  sys.exit(0)

              print_api_error(
                  f"App Store Connect API POST {relationship_url}:",
                  response,
              )
              sys.exit(1)
          PY

      - name: Manage App Store version
        if: steps.credentials.outputs.configured == 'true' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          pip3 install --quiet 'pyjwt[crypto]' requests \
            || pip3 install --quiet --user 'pyjwt[crypto]' requests \
            || pip3 install --quiet --break-system-packages 'pyjwt[crypto]' requests
          python3 - <<'PY'
          import os
          import re
          import sys
          import time
          from pathlib import Path

          import jwt
          import requests

          API_BASE = "https://api.appstoreconnect.apple.com/v1"
          BUNDLE_ID = "com.ralvarezmar.vcheck"
          EDITABLE_STATES = {
              "PREPARE_FOR_SUBMISSION",
              "DEVELOPER_REJECTED",
              "REJECTED",
              "METADATA_REJECTED",
          }
          REQUEST_TIMEOUT = 30
          MAX_WHATS_NEW_LENGTH = 4000

          key_id = os.environ["ASC_KEY_ID"]
          issuer_id = os.environ["ASC_ISSUER_ID"]
          key_path = os.environ["ASC_KEY_PATH"]
          build_number = os.environ["GITHUB_RUN_NUMBER"]
          version_name = os.environ["VERSION_NAME"]

          def token():
              now = int(time.time())
              with open(key_path, "rb") as handle:
                  private_key = handle.read()
              return jwt.encode(
                  {
                      "iss": issuer_id,
                      "iat": now,
                      "exp": now + 15 * 60,
                      "aud": "appstoreconnect-v1",
                  },
                  private_key,
                  algorithm="ES256",
                  headers={"kid": key_id, "typ": "JWT"},
              )

          def api_error(response):
              try:
                  errors = response.json().get("errors", [])
              except ValueError:
                  return f"HTTP {response.status_code}"
              details = []
              for error in errors[:3]:
                  if isinstance(error, dict):
                      code = error.get("code")
                      title = error.get("title")
                      detail = error.get("detail")
                      details.append(
                          ": ".join(
                              part
                              for part in (code, title, detail)
                              if part
                          )
                      )
              return f"HTTP {response.status_code}" + (
                  f" ({'; '.join(details)})" if details else ""
              )

          def request(method, url, **kwargs):
              headers = dict(kwargs.pop("headers", {}))
              headers["Authorization"] = f"Bearer {token()}"
              response = requests.request(
                  method,
                  url,
                  headers=headers,
                  timeout=REQUEST_TIMEOUT,
                  **kwargs,
              )
              if response.status_code >= 400:
                  raise RuntimeError(
                      f"App Store Connect API {method} {url}: {api_error(response)}"
                  )
              return response

          def warn(message):
              print(f"::warning::{message}", flush=True)

          def app_id():
              response = request(
                  "GET",
                  f"{API_BASE}/apps",
                  params={"filter[bundleId]": BUNDLE_ID, "limit": "1"},
              )
              apps = response.json().get("data", [])
              if not apps:
                  raise RuntimeError(
                      f"No App Store Connect app found for bundle id {BUNDLE_ID}"
                  )
              return apps[0]["id"]

          def app_store_version_id(app_identifier):
              response = request(
                  "GET",
                  f"{API_BASE}/apps/{app_identifier}/appStoreVersions",
                  params={
                      "filter[platform]": "IOS",
                      "filter[versionString]": version_name,
                      "limit": "50",
                  },
              )
              versions = response.json().get("data", [])
              versions.sort(
                  key=lambda item: item.get("attributes", {}).get(
                      "createdDate", ""
                  ),
                  reverse=True,
              )
              if versions:
                  selected = versions[0]
                  state = selected.get("attributes", {}).get(
                      "appStoreState", "UNKNOWN"
                  )
                  if state not in EDITABLE_STATES:
                      warn(
                          f"App Store version {version_name} exists in state "
                          f"{state}; leaving it unchanged."
                      )
                      return None
                  print(
                      f"Reusing editable App Store version {version_name} "
                      f"({selected['id']}, {state}).",
                      flush=True,
                  )
                  return selected["id"]

              payload = {
                  "data": {
                      "type": "appStoreVersions",
                      "attributes": {
                          "platform": "IOS",
                          "versionString": version_name,
                          "releaseType": "AFTER_APPROVAL",
                      },
                      "relationships": {
                          "app": {
                              "data": {"type": "apps", "id": app_identifier}
                          }
                      },
                  }
              }
              created = request(
                  "POST",
                  f"{API_BASE}/appStoreVersions",
                  headers={"Content-Type": "application/json"},
                  json=payload,
              ).json()["data"]
              print(
                  f"Created App Store version {version_name} ({created['id']}).",
                  flush=True,
              )
              return created["id"]

          def wait_for_build(app_identifier):
              deadline = time.monotonic() + 30 * 60
              while time.monotonic() < deadline:
                  response = request(
                      "GET",
                      f"{API_BASE}/builds",
                      params={
                          "filter[app]": app_identifier,
                          "filter[version]": build_number,
                          "limit": "1",
                      },
                  )
                  builds = response.json().get("data", [])
                  if builds:
                      build = builds[0]
                      state = build.get("attributes", {}).get(
                          "processingState", "UNKNOWN"
                      )
                      print(
                          f"Build {build_number} ({build['id']}) processing "
                          f"state: {state}",
                          flush=True,
                      )
                      if state == "VALID":
                          return build["id"]
                  else:
                      print(
                          f"Build {build_number} is not visible yet; retrying...",
                          flush=True,
                      )
                  time.sleep(30)
              warn(
                  f"Build {build_number} was not VALID after 30 minutes; "
                  "leaving the uploaded build untouched."
              )
              return None

          def attach_build(version_identifier, build_identifier):
              request(
                  "PATCH",
                  f"{API_BASE}/appStoreVersions/"
                  f"{version_identifier}/relationships/build",
                  headers={"Content-Type": "application/json"},
                  json={
                      "data": {"type": "builds", "id": build_identifier}
                  },
              )
              print(
                  f"Attached build {build_number} to App Store version "
                  f"{version_name}.",
                  flush=True,
              )

          def truncate_notes(text):
              if len(text) <= MAX_WHATS_NEW_LENGTH:
                  return text
              candidate = text[: MAX_WHATS_NEW_LENGTH + 1]
              boundary = max(candidate.rfind("\n"), candidate.rfind(" "))
              if boundary <= 0:
                  return text[:MAX_WHATS_NEW_LENGTH]
              return candidate[:boundary].rstrip()

          def sanitize_notes(text):
              lines = []
              for raw_line in str(text).splitlines():
                  line = raw_line.strip()
                  if not line:
                      if lines and lines[-1] != "":
                          lines.append("")
                      continue
                  heading = re.match(r"^#{1,6}\s+(.*)$", line)
                  if heading:
                      line = heading.group(1).strip()
                  elif line.startswith("- "):
                      line = f"• {line[2:].strip()}"
                  lines.append(line)
              return truncate_notes("\n".join(lines).strip())

          def changelog_notes():
              path = Path("CHANGELOG.md")
              if not path.is_file():
                  raise RuntimeError("CHANGELOG.md not found")
              contents = path.read_text(encoding="utf-8")
              match = re.search(
                  rf"^##\s+\[{re.escape(version_name)}[^\]]*\]"
                  rf"[^\r\n]*\r?\n(?P<body>.*?)(?=^##\s+\[|\Z)",
                  contents,
                  flags=re.MULTILINE | re.DOTALL,
              )
              if match is None:
                  raise RuntimeError(
                      f"CHANGELOG.md has no section for {version_name}"
                  )
              notes = sanitize_notes(match.group("body").strip())
              if not notes:
                  raise RuntimeError(
                      f"CHANGELOG.md section for {version_name} is empty"
                  )
              return notes

          def update_localizations(version_identifier, notes):
              response = request(
                  "GET",
                  f"{API_BASE}/appStoreVersions/"
                  f"{version_identifier}/appStoreVersionLocalizations",
                  params={
                      "limit": "200",
                  },
              )
              localizations = response.json().get("data", [])
              spanish = next(
                  (
                      localization
                      for localization in localizations
                      if localization.get("attributes", {}).get("locale")
                      == "es-ES"
                  ),
                  None,
              )
              for localization in localizations:
                  locale = localization.get("attributes", {}).get(
                      "locale", "<unknown>"
                  )
                  if locale != "es-ES":
                      warn(
                          f"No changelog is available for App Store locale "
                          f"{locale}; leaving its whatsNew unchanged."
                      )

              if spanish is None:
                  payload = {
                      "data": {
                          "type": "appStoreVersionLocalizations",
                          "attributes": {
                              "locale": "es-ES",
                              "whatsNew": notes,
                          },
                          "relationships": {
                              "appStoreVersion": {
                                  "data": {
                                      "type": "appStoreVersions",
                                      "id": version_identifier,
                                  }
                              }
                          },
                      }
                  }
                  request(
                      "POST",
                      f"{API_BASE}/appStoreVersionLocalizations",
                      headers={"Content-Type": "application/json"},
                      json=payload,
                  )
                  print(
                      "Created Spanish App Store whatsNew localization.",
                      flush=True,
                  )
                  return

              request(
                  "PATCH",
                  f"{API_BASE}/appStoreVersionLocalizations/{spanish['id']}",
                  headers={"Content-Type": "application/json"},
                  json={
                      "data": {
                          "type": "appStoreVersionLocalizations",
                          "id": spanish["id"],
                          "attributes": {"whatsNew": notes},
                      }
                  },
              )
              print(
                  "Updated Spanish App Store whatsNew localization.",
                  flush=True,
              )

          try:
              identifier = app_id()
              version_identifier = app_store_version_id(identifier)
              if version_identifier is not None:
                  try:
                      build_identifier = wait_for_build(identifier)
                  except Exception as error:
                      warn(f"Could not wait for App Store build: {error}")
                      build_identifier = None
                  if build_identifier is not None:
                      try:
                          attach_build(version_identifier, build_identifier)
                      except Exception as error:
                          warn(f"Could not attach App Store build: {error}")
                  try:
                      notes = changelog_notes()
                      update_localizations(version_identifier, notes)
                  except Exception as error:
                      warn(f"Could not update App Store whatsNew: {error}")
          except Exception as error:
              warn(f"App Store version management skipped: {error}")
              sys.exit(0)
          PY

      - name: Create GitHub Release
        if: steps.credentials.outputs.configured == 'true' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: release-notes.md
