name: iOS Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  release:
    # macos-26 ships Xcode 26 (iOS 26 SDK), required by App Store Connect for
    # uploads. Older images (Xcode 16 / iOS 18 SDK) are rejected on validation.
    runs-on: macos-26
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
      ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode and show SDK
        run: |
          latest="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$latest" ]; then
            sudo xcode-select -s "$latest/Contents/Developer"
          fi
          xcodebuild -version
          xcodebuild -showsdks | grep -i "iphoneos" || true

      - name: Check App Store Connect credentials
        id: credentials
        run: |
          if [[ -z "$ASC_KEY_ID" || -z "$ASC_ISSUER_ID" || -z "$ASC_API_KEY_P8" ]]; then
            echo "App Store Connect secrets are not configured; skipping iOS release."
            echo "Configure ASC_KEY_ID, ASC_ISSUER_ID, and ASC_API_KEY_P8 to enable releases."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "App Store Connect credentials are configured."
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install XcodeGen
        if: steps.credentials.outputs.configured == 'true'
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_INSTALL_CLEANUP=1
          brew install xcodegen

      - name: Generate Xcode project
        if: steps.credentials.outputs.configured == 'true'
        run: xcodegen generate

      - name: Prepare App Store Connect API key
        if: steps.credentials.outputs.configured == 'true'
        run: |
          KEY_DIR="$RUNNER_TEMP/app-store-connect"
          KEY_PATH="$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          mkdir -p "$KEY_DIR" "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_API_KEY_P8" | base64 -D > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          cp "$KEY_PATH" "$HOME/.appstoreconnect/private_keys/"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Archive app
        if: steps.credentials.outputs.configured == 'true'
        run: |
          set -o pipefail
          # Sign the archive directly for App Store distribution. Requesting the
          # "Apple Distribution" identity with automatic signing provisions a
          # *distribution* (App Store) profile via the API key, which — unlike a
          # development profile — does NOT require registered devices. This
          # produces a consistent distribution signature on the app and its
          # embedded widget, avoiding the broken-seal errors seen when exporting
          # an unsigned archive.
          MARKETING_VERSION="${MARKETING_VERSION:-1.0.0}"
          CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}"
          echo "Building version $MARKETING_VERSION ($CURRENT_PROJECT_VERSION)"
          xcodebuild archive \
            -project VeganChecker.xcodeproj \
            -scheme VeganChecker \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/VeganLens.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$ASC_TEAM_ID" \
            | tee "$RUNNER_TEMP/xcodebuild-archive.log"

      - name: Surface archive failure
        if: failure()
        run: |
          log="$RUNNER_TEMP/xcodebuild-archive.log"
          if [ -f "$log" ]; then
            grep -iE "error:|provisioning|signing|cloud|development team|no profiles|certificate|no account|agreement|permission|entitlement|not been created|does not have|unable to" "$log" | tail -n 60 | while IFS= read -r line; do
              echo "::error::$line"
            done
            tail -n 30 "$log" | while IFS= read -r line; do echo "::error::TAIL: $line"; done
          else
            echo "::error::no archive log found"
          fi

      - name: Create export options
        if: steps.credentials.outputs.configured == 'true'
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>destination</key>
              <string>export</string>
              <key>method</key>
              <string>app-store-connect</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>uploadBitcode</key>
              <false/>
          </dict>
          </plist>
          PLIST
          if [ -n "$ASC_TEAM_ID" ]; then
            /usr/libexec/PlistBuddy \
              -c "Add :teamID string $ASC_TEAM_ID" \
              "$RUNNER_TEMP/ExportOptions.plist"
          fi

      - name: Export archive
        if: steps.credentials.outputs.configured == 'true'
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/VeganLens.xcarchive" \
            -exportPath "$RUNNER_TEMP/VeganLens-export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tee "$RUNNER_TEMP/xcodebuild-export.log"

      - name: Surface export failure
        if: failure()
        run: |
          log="$RUNNER_TEMP/xcodebuild-export.log"
          if [ -f "$log" ]; then
            grep -iE "error:|provisioning|signing|cloud|development team|no profiles|certificate|no account|agreement|permission|entitlement|not been created|does not have|unable to" "$log" | tail -n 60 | while IFS= read -r line; do
              echo "::error::$line"
            done
            tail -n 30 "$log" | while IFS= read -r line; do echo "::error::TAIL: $line"; done
          else
            echo "::error::no export log found"
          fi

      - name: Inspect export signing
        if: steps.credentials.outputs.configured == 'true'
        run: |
          ipa="$(find "$RUNNER_TEMP/VeganLens-export" -maxdepth 1 -name '*.ipa' | head -n1)"
          work="$RUNNER_TEMP/signcheck"
          rm -rf "$work"; mkdir -p "$work"
          unzip -q "$ipa" -d "$work"
          app="$(find "$work/Payload" -maxdepth 1 -name '*.app' | head -n1)"
          echo "::error::APP $(codesign -dvvv "$app" 2>&1 | grep -iE 'Authority|TeamIdentifier|flags' | tr '\n' ' ')"
          for ax in "$app"/PlugIns/*.appex; do
            echo "::error::APPEX $(basename "$ax") $(codesign -dvvv "$ax" 2>&1 | grep -iE 'Authority|TeamIdentifier|flags' | tr '\n' ' ')"
          done
          echo "::error::EXPORTLOG $(grep -iE "widget|appex|profile|signing|distribution|apple distribution" "$RUNNER_TEMP/xcodebuild-export.log" | tail -n 25 | tr '\n' '|')"
          echo "::error::PLIST_ICONS $(plutil -p "$app/Info.plist" | grep -iE 'icon' | tr '\n' '|')"
          echo "::error::BUNDLE_FILES $(ls -1 "$app" | grep -iE 'appicon|\.car|\.png|assets' | tr '\n' '|')"
          if [ -f "$app/Assets.car" ]; then
            echo "::error::CAR_ICONS $(xcrun assetutil --info "$app/Assets.car" 2>/dev/null | grep -iE 'AppIcon|"Name"|RenditionName|SizeOnDisk' | head -n 30 | tr '\n' '|')"
          else
            echo "::error::CAR_ICONS no Assets.car in app bundle"
          fi
          echo "::error::LOOSE_ICONS $(find "$app" -maxdepth 1 -iname '*icon*' | tr '\n' '|')"

      - name: Upload to App Store Connect
        if: steps.credentials.outputs.configured == 'true'
        run: |
          set -o pipefail
          ipa="$(find "$RUNNER_TEMP/VeganLens-export" -maxdepth 1 -name '*.ipa' | head -n1)"
          echo "Uploading IPA: $ipa"
          xcrun altool \
            --upload-app \
            --file "$ipa" \
            --type ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/altool-upload.log"

      - name: Surface upload failure
        if: failure()
        run: |
          log="$RUNNER_TEMP/altool-upload.log"
          if [ -f "$log" ]; then
            tail -n 60 "$log" | while IFS= read -r line; do echo "::error::$line"; done
          else
            echo "::error::no upload log found (ipa may be missing)"
            ls -la "$RUNNER_TEMP/VeganLens-export" 2>&1 | while IFS= read -r line; do echo "::error::$line"; done
          fi
