name: iOS CI

on:
  push:
    branches:
      - development
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run iOS unit tests
        run: xcodebuild test -scheme VeganChecker -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' -derivedDataPath build
