name: iOS CI

on:
  push:
    branches:
      - development
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_INSTALL_CLEANUP=1
          brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick iOS simulator
        id: simulator
        run: |
          SIMULATOR_UDID=$(python3 - <<'PY'
          import json
          import subprocess

          devices = json.loads(subprocess.check_output([
              "xcrun",
              "simctl",
              "list",
              "devices",
              "available",
              "-j",
          ]))["devices"]

          for runtime_devices in devices.values():
              for device in runtime_devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone "):
                      print(device["udid"])
                      raise SystemExit

          raise SystemExit("No available iPhone simulator found")
          PY
          )
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b || true
          echo "udid=$SIMULATOR_UDID" >> "$GITHUB_OUTPUT"

      - name: Run iOS unit tests
        id: tests
        continue-on-error: true
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild test -scheme VeganChecker -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" -destination-timeout 60 -derivedDataPath build 2>&1 | tee build/xcodebuild.log

      - name: Surface iOS test failure
        if: steps.tests.outcome == 'failure'
        run: |
          tail -n 80 build/xcodebuild.log
          tail -n 40 build/xcodebuild.log | sed 's/^/::error::/'
          exit 1
