name: iOS CI

on:
  push:
    branches:
      - main
      - development
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    env:
      EXPECTED_SCREENSHOTS: 7
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check localization key parity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          directories = ("en.lproj", "es.lproj", "pt.lproj", "it.lproj", "fr.lproj", "de.lproj")
          files = {
              directory: Path("VeganChecker") / directory / "Localizable.strings"
              for directory in directories
          }
          key_sets = {}
          pattern = re.compile(r'^\s*"((?:[^"\\]|\\.)+)"\s*=', re.MULTILINE)
          for directory, path in files.items():
              if not path.is_file():
                  print(f"Missing localization file: {path}", file=sys.stderr)
                  sys.exit(1)
              key_sets[directory] = {
                  match.group(1)
                  for match in pattern.finditer(path.read_text(encoding="utf-8"))
              }

          expected = set().union(*key_sets.values())
          errors = False
          for directory, keys in key_sets.items():
              missing = sorted(expected - keys)
              extra = sorted(keys - expected)
              if missing or extra:
                  errors = True
                  print(f"{directory}: missing={missing or '<none>'}; extra={extra or '<none>'}")

          if errors:
              sys.exit("Localization key parity check failed")
          print(
              f"Localization key parity OK for {len(key_sets)} locales "
              f"({len(expected)} keys)"
          )
          PY

      - name: Install XcodeGen
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_INSTALL_CLEANUP=1
          brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick iOS simulator
        id: simulator
        run: |
          SIMULATOR_UDID=$(python3 - <<'PY'
          import json
          import subprocess

          devices = json.loads(subprocess.check_output([
              "xcrun",
              "simctl",
              "list",
              "devices",
              "available",
              "-j",
          ]))["devices"]

          for runtime_devices in devices.values():
              for device in runtime_devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone "):
                      print(device["udid"])
                      raise SystemExit

          raise SystemExit("No available iPhone simulator found")
          PY
          )
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b || true
          echo "udid=$SIMULATOR_UDID" >> "$GITHUB_OUTPUT"

      - name: Build for iOS Simulator
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild \
            -project VeganChecker.xcodeproj \
            -scheme VeganChecker \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -destination-timeout 60 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build/xcodebuild.log

      - name: Run unit tests on iOS Simulator
        run: |
          rm -rf build/Result-unit.xcresult
          set -o pipefail
          xcodebuild \
            -project VeganChecker.xcodeproj \
            -scheme VeganChecker \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -destination-timeout 60 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -resultBundlePath build/Result-unit.xcresult \
            -only-testing:VeganCheckerTests \
            test 2>&1 | tee build/xcodebuild-unit-tests.log
          if ! grep -Eq 'Executed [1-9][0-9]* tests?' build/xcodebuild-unit-tests.log; then
            echo "::error::iOS unit-test run did not report any executed tests"
            exit 1
          fi

      - name: Run UI tests on iOS Simulator
        run: |
          rm -rf build/Result.xcresult
          set -o pipefail
          xcodebuild \
            -project VeganChecker.xcodeproj \
            -scheme VeganChecker \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -destination-timeout 60 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -resultBundlePath build/Result.xcresult \
            test 2>&1 | tee build/xcodebuild-ui-tests.log

      - name: Export UI test screenshots
        if: always()
        run: |
          rm -rf build/screenshots
          mkdir -p build/screenshots
          if [ -d build/Result.xcresult ]; then
            if ! xcrun xcresulttool export attachments \
              --path build/Result.xcresult \
              --output-path build/screenshots; then
              echo "Warning: failed to export xcresult attachments"
            fi
          else
            echo "Warning: result bundle was not created"
          fi
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          output = Path("build/screenshots")
          manifest_path = output / "manifest.json"
          if not manifest_path.exists():
              raise SystemExit(0)

          manifest = json.loads(manifest_path.read_text())
          attachments = {}

          def collect(value):
              if isinstance(value, dict):
                  attachment_id = value.get("attachmentID") or value.get("attachmentId")
                  name = value.get("suggestedHumanReadableName")
                  if attachment_id and name:
                      attachments[attachment_id] = name
                  for child in value.values():
                      collect(child)
              elif isinstance(value, list):
                  for child in value:
                      collect(child)

          collect(manifest)

          used_names = set()
          for attachment_id, suggested_name in attachments.items():
              candidates = [
                  path for path in output.iterdir()
                  if path.is_file() and path.name != "manifest.json"
                  and path.name.startswith(attachment_id)
              ]
              for source in candidates:
                  safe_name = re.sub(r"[^A-Za-z0-9._-]+", "-", suggested_name).strip("-")
                  if not safe_name:
                      safe_name = attachment_id
                  suffix = source.suffix
                  if not Path(safe_name).suffix:
                      safe_name += suffix
                  destination = output / safe_name
                  counter = 2
                  while destination.name in used_names or destination.exists():
                      destination = output / f"{destination.stem}-{counter}{destination.suffix}"
                      counter += 1
                  source.rename(destination)
                  used_names.add(destination.name)
          PY

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-screenshots
          path: build/screenshots/**
          if-no-files-found: warn

      - name: Capture App Store screenshots
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p build/appstore build/appstore-screenshots

          runtime_id=$(python3 - <<'PY'
          import json
          import subprocess

          runtimes = json.loads(subprocess.check_output([
              "xcrun", "simctl", "list", "runtimes", "-j",
          ]))["runtimes"]
          available = [
              runtime for runtime in runtimes
              if runtime.get("isAvailable")
              and runtime.get("platform") == "iOS"
          ]
          if not available:
              raise SystemExit(0)

          def version(runtime):
              identifier = runtime.get("identifier", "")
              suffix = identifier.rsplit(".iOS-", 1)[-1]
              return tuple(int(part) for part in suffix.split("-") if part.isdigit())

          print(max(available, key=version)["identifier"])
          PY
          )
          if [ -z "$runtime_id" ]; then
            echo "warn: no available iOS simulator runtime found"
            exit 0
          fi

          resolve_device_type() {
            python3 - "$1" <<'PY'
          import json
          import subprocess
          import sys

          label = sys.argv[1]
          device_types = json.loads(subprocess.check_output([
              "xcrun", "simctl", "list", "devicetypes", "-j",
          ]))["devicetypes"]

          def version(device):
              name = device.get("name", "")
              numbers = []
              for token in name.replace("-", " ").replace(".", " ").split():
                  if token.isdigit():
                      numbers.append(int(token))
              return tuple(numbers)

          def newest(candidates):
              if not candidates:
                  return ""
              return max(candidates, key=lambda device: (version(device), device.get("identifier", "")))[
                  "identifier"
              ]

          preferred = {
              "iphone-6-9": ["iPhone 16 Pro Max"],
              "iphone-6-5": ["iPhone 11 Pro Max"],
              "ipad-13": ["iPad Pro 13-inch (M4)", "iPad Pro (12.9-inch)"],
          }[label]
          for preferred_name in preferred:
              candidates = [
                  device for device in device_types
                  if preferred_name in device.get("name", "")
              ]
              if candidates:
                  print(newest(candidates))
                  raise SystemExit(0)

          if label == "iphone-6-9":
              candidates = [
                  device for device in device_types
                  if device.get("name", "").startswith("iPhone ")
                  and "Pro Max" in device.get("name", "")
              ]
          elif label == "iphone-6-5":
              candidates = [
                  device for device in device_types
                  if device.get("name", "").startswith("iPhone ")
                  and ("11 Pro Max" in device.get("name", "") or "Plus" in device.get("name", ""))
              ]
          else:
              candidates = [
                  device for device in device_types
                  if device.get("name", "").startswith("iPad Pro")
                  and ("13-inch" in device.get("name", "")
                       or "12.9-inch" in device.get("name", ""))
              ]
          print(newest(candidates))
          PY
          }

          export_attachments() {
            result_bundle="$1"
            output="$2"
            if [ ! -d "$result_bundle" ]; then
              echo "warn: result bundle was not created: $result_bundle"
              return 0
            fi
            if ! xcrun xcresulttool export attachments \
              --path "$result_bundle" \
              --output-path "$output"; then
              echo "warn: failed to export attachments from $result_bundle"
              return 0
            fi
            python3 - "$output" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          output = Path(sys.argv[1])
          manifest_path = output / "manifest.json"
          if not manifest_path.exists():
              raise SystemExit(0)

          manifest = json.loads(manifest_path.read_text())
          attachments = []
          seen_attachments = set()

          def collect(value):
              if isinstance(value, dict):
                  attachment_id = value.get("attachmentID") or value.get("attachmentId")
                  name = value.get("suggestedHumanReadableName") or ""
                  exported_name = (
                      value.get("exportedFileName")
                      or value.get("exportedFilename")
                      or ""
                  )
                  attachment_key = (attachment_id, exported_name)
                  if attachment_id and attachment_key not in seen_attachments:
                      attachments.append((attachment_id, name, exported_name))
                      seen_attachments.add(attachment_key)
                  for child in value.values():
                      collect(child)
              elif isinstance(value, list):
                  for child in value:
                      collect(child)

          collect(manifest)

          image_suffixes = {".heic", ".jpeg", ".jpg", ".png", ".tif", ".tiff"}
          used_names = set()
          capture_index = 1
          claimed_sources = set()
          image_sources = sorted(
              (
                  path
                  for path in output.iterdir()
                  if path.is_file()
                  and path.name != "manifest.json"
                  and path.suffix.casefold() in image_suffixes
              ),
              key=lambda path: path.name,
          )
          for attachment_id, suggested_name, exported_name in attachments:
              if exported_name:
                  exported_path = output / Path(exported_name).name
                  attachment_files = (
                      [exported_path] if exported_path.is_file() else []
                  )
              else:
                  attachment_files = sorted(
                      (
                          path
                          for path in output.iterdir()
                          if path.is_file()
                          and path.name != "manifest.json"
                          and path.name.startswith(attachment_id)
                      ),
                      key=lambda path: path.name,
                  )
              attachment_files = [
                  path for path in attachment_files if path not in claimed_sources
              ]
              if not attachment_files:
                  attachment_files = [
                      path for path in image_sources
                      if path not in claimed_sources
                  ][:1]
              candidates = []
              for source in attachment_files:
                  if source.suffix.casefold() in image_suffixes:
                      candidates.append(source)
                  else:
                      source.unlink()
              for source in candidates:
                  base_name = Path(suggested_name).stem.casefold()
                  safe_name = re.sub(r"[^a-z0-9]+", "-", base_name).strip("-")
                  suffix = source.suffix
                  if not safe_name:
                      destination = output / f"{capture_index:02d}{suffix}"
                  else:
                      destination = output / f"{capture_index:02d}-{safe_name}{suffix}"
                  counter = 2
                  while destination.name in used_names or destination.exists():
                      destination = output / f"{destination.stem}-{counter}{destination.suffix}"
                      counter += 1
                  source.rename(destination)
                  used_names.add(destination.name)
                  claimed_sources.add(source)
                  capture_index += 1

          for source in sorted(output.iterdir(), key=lambda path: path.name):
              if (
                  not source.is_file()
                  or source.name == "manifest.json"
                  or source.name in used_names
              ):
                  continue
              if source.suffix.casefold() not in image_suffixes:
                  source.unlink()
                  continue
              destination = output / f"{capture_index:02d}{source.suffix}"
              counter = 2
              while destination.name in used_names or destination.exists():
                  destination = output / f"{destination.stem}-{counter}{destination.suffix}"
                  counter += 1
              source.rename(destination)
              used_names.add(destination.name)
              capture_index += 1
          PY
          }

          capture_device() {
            label="$1"
            device_type_id="$2"
            if [ -z "$device_type_id" ]; then
              echo "warn: no simulator device type found for $label; skipping"
              return 0
            fi

            simulator_name="screenshots-$label"
            simulator_udid=$(xcrun simctl create "$simulator_name" "$device_type_id" "$runtime_id") || {
              echo "warn: failed to create simulator for $label"
              return 1
            }
            result_bundle="build/appstore/$label.xcresult"
            output="build/appstore-screenshots/$label"
            rm -rf "$output"
            mkdir -p "$output"
            rm -rf "$result_bundle"

            status=0
            xcrun simctl boot "$simulator_udid" || status=$?
            xcrun simctl bootstatus "$simulator_udid" -b || status=$?
            if [ "$status" -eq 0 ]; then
              xcodebuild \
                -project VeganChecker.xcodeproj \
                -scheme VeganChecker \
                -destination "platform=iOS Simulator,id=$simulator_udid" \
                CODE_SIGNING_ALLOWED=NO \
                CODE_SIGNING_REQUIRED=NO \
                -only-testing:VeganCheckerUITests/ScreenshotUITests \
                -resultBundlePath "$result_bundle" \
                test || status=$?
            fi
            export_attachments "$result_bundle" "$output"
            xcrun simctl shutdown "$simulator_udid" || true
            xcrun simctl delete "$simulator_udid" || true
            if [ "$status" -ne 0 ]; then
              echo "warn: $label failed"
            else
              shopt -s nullglob
              files=("$output"/*.png)
              if [ "${#files[@]}" -ne "$EXPECTED_SCREENSHOTS" ]; then
                echo "warn: $label produced ${#files[@]} PNGs; expected ${EXPECTED_SCREENSHOTS}"
                status=1
              else
                : > "$output/.capture-complete"
              fi
            fi
            return "$status"
          }

          capture_device iphone-6-9 "$(resolve_device_type iphone-6-9)" || echo "warn: iphone-6-9 failed"
          capture_device iphone-6-5 "$(resolve_device_type iphone-6-5)" || echo "warn: iphone-6-5 failed"
          capture_device ipad-13 "$(resolve_device_type ipad-13)" || echo "warn: ipad-13 failed"

          shopt -s nullglob
          normalize_pngs() {
            label="$1"
            height="$2"
            width="$3"
            files=(build/appstore-screenshots/"$label"/*.png)
            if [ "${#files[@]}" -eq 0 ]; then
              echo "No PNGs to normalize for $label"
              return 0
            fi
            for file in "${files[@]}"; do
              if sips -z "$height" "$width" "$file" >/dev/null; then
                echo "Normalized $file to ${width}x${height}"
              else
                echo "warn: failed to normalize $file"
              fi
            done
          }
          normalize_pngs iphone-6-9 2868 1320
          normalize_pngs iphone-6-5 2688 1242
          normalize_pngs ipad-13 2752 2064

      - name: Upload App Store screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-store-screenshots
          path: build/appstore-screenshots/**
          if-no-files-found: warn

      - name: Commit App Store screenshots
        if: ${{ always() && (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/main') }}
        run: |
          set -euo pipefail
          for label in iphone-6-9 iphone-6-5 ipad-13; do
            source_dir="build/appstore-screenshots/$label"
            files=("$source_dir"/*.png)
            if [ ! -f "$source_dir/.capture-complete" ] || [ "${#files[@]}" -ne "$EXPECTED_SCREENSHOTS" ]; then
              echo "Incomplete App Store screenshot set for $label: got ${#files[@]}, expected ${EXPECTED_SCREENSHOTS}; preserving existing files"
              continue
            fi
            destination_dir="store/appstore/screenshots/$label"
            mkdir -p "$destination_dir"
            find "$destination_dir" -maxdepth 1 -type f -name "*.png" -delete
            for file in "${files[@]}"; do
              [ -f "$file" ] || continue
              cp "$file" "$destination_dir/"
            done
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- store/appstore/screenshots
          if git diff --cached --quiet; then
            echo "No App Store screenshot changes to commit"
            exit 0
          fi

          git commit -m "chore(ios): update App Store screenshots [skip ci]"
          pushed=false
          compact_git_output() {
            output="$1"
            output="${output//$'\n'/ }"
            output="${output//$'\r'/ }"
            printf '%s' "$output" | tr -s ' '
          }
          for attempt in 1 2 3; do
            if ! fetch_output=$(git fetch origin "$GITHUB_REF_NAME" 2>&1); then
              echo "::warning::Could not fetch ${GITHUB_REF_NAME} before screenshot push attempt ${attempt}: $(compact_git_output "$fetch_output")"
              break
            fi
            if ! rebase_output=$(git rebase --autostash "origin/${GITHUB_REF_NAME}" 2>&1); then
              git rebase --abort || true
              echo "::warning::Could not rebase screenshot changes onto origin/${GITHUB_REF_NAME} (attempt ${attempt}): $(compact_git_output "$rebase_output")"
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 10))
                continue
              fi
              break
            fi
            if push_output=$(git push origin "HEAD:${GITHUB_REF_NAME}" 2>&1); then
              pushed=true
              break
            else
              echo "::warning::Screenshot push attempt ${attempt} failed: $(compact_git_output "$push_output")"
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done
          if [ "$pushed" != true ]; then
            echo "::warning::Could not push App Store screenshots to ${GITHUB_REF_NAME} after 3 attempts; continuing CI."
          fi

      - name: Surface build failure
        if: failure()
        run: |
          grep -nE 'error:|fatal error:|BUILD FAILED' build/xcodebuild.log build/xcodebuild-ui-tests.log 2>/dev/null | head -n 200 | while IFS= read -r line; do
            echo "::error file=VeganChecker/Build.swift::$line"
          done
