server {
    listen 8080;
    server_name $AWS_SITE_HOST;
    root /usr/share/nginx/html;
    index index.html;

    # access_log /app/access.log main;
    # error_log /app/error.log debug;

    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    location ~ ^/(community/docs)(/.*)$ {
        try_files $2 $2/ $uri;
    }

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}