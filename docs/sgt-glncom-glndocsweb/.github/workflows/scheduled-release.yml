name: Scheduled Release Management

on:
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force release even if no changes detected'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Dry run - only check for changes without creating release'
        required: false
        type: boolean
        default: false

env:
  RELEASE_MANAGER_BOT: 'github-actions[bot]'
  DOCS_PATH: 'docs'

jobs:
  prepare-workspace:
    name: Prepare Workspace
    runs-on: base-runner
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
      changed_files: ${{ steps.check.outputs.changed_files }}
      pr_info: ${{ steps.check.outputs.pr_info }}
      teams_affected: ${{ steps.check.outputs.teams_affected }}
      new_version: ${{ steps.update_version.outputs.new_version }}
      last_tag: ${{ steps.last_release.outputs.last_tag }}
    steps:
      - name: Get GitHub App token
        id: get-token
        uses: santander-group-shared-assets/gln-get-github-app-token-action@main
        with:
          organization: santander-group-shared-assets
          app-id: ${{ secrets.APPLICATION_ID }}
          private-key: ${{ secrets.APPLICATION_PRIVATE_KEY }}

      - name: Checkout repository (single checkout for all jobs)
        uses: actions/checkout@v4
        with:
          fetch-depth: 50
          token: ${{ steps.get-token.outputs.token }}
          fetch-tags: false

      - name: Configure Git credentials
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          echo "GITHUB_TOKEN=${{ steps.get-token.outputs.token }}" >> $GITHUB_ENV
          
          # Configure git credentials helper for HTTPS authentication
          git config --global credential.helper store
          echo "https://x-access-token:${{ steps.get-token.outputs.token }}@github.com" > ~/.git-credentials
          chmod 600 ~/.git-credentials

      - name: Get last release tag
        id: last_release
        run: |
          # Use GitHub API instead of git fetch (much faster - no tag download required)
          # Get the latest production releases sorted by version
          # Filter out pre-releases and RC versions
          LAST_TAG=$(gh api repos/${{ github.repository }}/releases \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' \
            --paginate | head -1 || echo "")
          
          if [ -z "$LAST_TAG" ]; then
            # If no releases found via API, fall back to git (local operation only)
            LAST_TAG=$(git tag -l --merged HEAD | grep -v 'rc' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || echo "")
          fi
          
          if [ -z "$LAST_TAG" ]; then
            # If still no tags found, use first commit
            LAST_TAG=$(git rev-list --max-parents=0 HEAD)
            echo "WARNING: No production releases found, using first commit: $LAST_TAG"
          fi
          
          echo "last_tag=$LAST_TAG" >> $GITHUB_OUTPUT
          echo "Last production release tag: $LAST_TAG"
        env:
          GH_TOKEN: ${{ steps.get-token.outputs.token }}

      - name: Check for changes in docs folder
        id: check
        run: |
          LAST_TAG="${{ steps.last_release.outputs.last_tag }}"
          
          # Efficient diff check - only checks specified path
          CHANGED_FILES=$(git diff --name-only $LAST_TAG..HEAD -- docs/ 2>/dev/null || echo "")
          
          if [ -z "$CHANGED_FILES" ] && [ "${{ inputs.force_release }}" != "true" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected in docs/ folder since last release"
            exit 0
          fi
          
          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "Changed files detected:"
          echo "$CHANGED_FILES"
          
          echo "changed_files<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED_FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          # Get commits only for changed files - limit search to 20 recent commits
          COMMITS=$(git log $LAST_TAG..HEAD --max-count=20 --oneline --pretty=format:"%H" -- docs/ 2>/dev/null || echo "")
          
          PR_INFO=""
          TEAMS_AFFECTED=""
          
          if [ ! -z "$COMMITS" ]; then
            # Only process the most recent commit to find PR
            LATEST_COMMIT=$(echo "$COMMITS" | head -1)
            PR_NUMBER=$(gh pr list --state merged --search "$LATEST_COMMIT" --json number --limit=1 --jq '.[0].number' 2>/dev/null || echo "")
            
            if [ ! -z "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
              PR_DATA=$(gh pr view $PR_NUMBER --json author,title,files,url 2>/dev/null || echo "")
              
              if [ ! -z "$PR_DATA" ] && [ "$PR_DATA" != "null" ]; then
                AUTHOR=$(echo "$PR_DATA" | jq -r '.author.login')
                TITLE=$(echo "$PR_DATA" | jq -r '.title')
                URL=$(echo "$PR_DATA" | jq -r '.url')
                FILES=$(echo "$PR_DATA" | jq -r '.files[].path' | grep "^docs/" || echo "")
                
                TEAMS_FOR_PR=""
                for file in $FILES; do
                  case "$file" in
                    "docs/application/application-management"*) TEAMS_FOR_PR="$TEAMS_FOR_PR Management" ;;
                    "docs/application/ci-cd"*) TEAMS_FOR_PR="$TEAMS_FOR_PR Software CICD" ;;
                    "docs/application/component-management"*) TEAMS_FOR_PR="$TEAMS_FOR_PR Management" ;;
                    "docs/application/exception-management"*) TEAMS_FOR_PR="$TEAMS_FOR_PR Back" ;;
                    "docs/application/iac"*) TEAMS_FOR_PR="$TEAMS_FOR_PR IAC" ;;
                    "docs/application/images"*) TEAMS_FOR_PR="$TEAMS_FOR_PR Release Management" ;;
                    "docs/application/qatesting"*) TEAMS_FOR_PR="$TEAMS_FOR_PR Testing" ;;
                    "docs/application/release-management"*) TEAMS_FOR_PR="$TEAMS_FOR_PR Release" ;;
                    "docs/application/security"*) TEAMS_FOR_PR="$TEAMS_FOR_PR Security" ;;
                    "docs/application/users-teams"*) TEAMS_FOR_PR="$TEAMS_FOR_PR Management" ;;
                    "docs/architecture"*) TEAMS_FOR_PR="$TEAMS_FOR_PR Architecture" ;;
                    "docs/changelog"*) TEAMS_FOR_PR="$TEAMS_FOR_PR All Teams" ;;
                    *) TEAMS_FOR_PR="$TEAMS_FOR_PR Release Management" ;;
                  esac
                done
                
                TEAMS_FOR_PR=$(echo "$TEAMS_FOR_PR" | tr ' ' '\n' | sort -u | tr '\n' ' ')
                
                PR_INFO="$PR_INFO|PR#$PR_NUMBER|$AUTHOR|$TITLE|$TEAMS_FOR_PR|$URL|$(echo "$FILES" | tr '\n' ',')"
                TEAMS_AFFECTED="$TEAMS_AFFECTED $TEAMS_FOR_PR"
              fi
            fi
          fi
          
          TEAMS_AFFECTED=$(echo "$TEAMS_AFFECTED" | tr ' ' '\n' | sort -u | tr '\n' ' ')
          
          echo "pr_info<<EOF" >> $GITHUB_OUTPUT
          echo "$PR_INFO" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          echo "teams_affected<<EOF" >> $GITHUB_OUTPUT
          echo "$TEAMS_AFFECTED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Calculate new version
        id: version
        run: |
          CURRENT_VERSION=$(grep "__version__" version.py | sed 's/__version__ = "\(.*\)"/\1/')
          echo "Current version: $CURRENT_VERSION"
          
          IFS='.' read -ra VERSION_PARTS <<< "$CURRENT_VERSION"
          MAJOR=${VERSION_PARTS[0]}
          MINOR=${VERSION_PARTS[1]}
          PATCH=${VERSION_PARTS[2]}
          
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"
        env:
          GH_TOKEN: ${{ steps.get-token.outputs.token }}

      - name: Output version for release
        id: update_version
        run: |
          # Simply pass the calculated version to outputs (actual file update will be in create-release)
          NEW_VERSION="${{ steps.version.outputs.new_version }}"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ steps.get-token.outputs.token }}

  create-release:
    name: Create Release
    needs: prepare-workspace
    if: needs.prepare-workspace.outputs.has_changes == 'true' && inputs.dry_run != 'true'
    runs-on: base-runner
    steps:
      - name: Get GitHub App token
        id: get-token
        uses: santander-group-shared-assets/gln-get-github-app-token-action@main
        with:
          organization: santander-group-shared-assets
          app-id: ${{ secrets.APPLICATION_ID }}
          private-key: ${{ secrets.APPLICATION_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ steps.get-token.outputs.token }}

      - name: Create release branch and update version
        id: release_branch
        run: |
          NEW_VERSION="${{ needs.prepare-workspace.outputs.new_version }}"
          BRANCH_NAME="release/v${NEW_VERSION}"
          
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Create and checkout new branch
          git checkout -b "${BRANCH_NAME}"
          
          # Update version.py
          sed -i "s/__version__ = \".*\"/__version__ = \"${NEW_VERSION}\"/" version.py
          git add version.py
          git commit -m "chore: bump version to ${NEW_VERSION}"
          git push --set-upstream origin "${BRANCH_NAME}"
          
          echo "branch_name=${BRANCH_NAME}" >> $GITHUB_OUTPUT
          echo "Release branch created: ${BRANCH_NAME}"
        env:
          GH_TOKEN: ${{ steps.get-token.outputs.token }}

      - name: Create Pull Request
        id: create_pr
        run: |
          NEW_VERSION="${{ needs.prepare-workspace.outputs.new_version }}"
          BRANCH_NAME="${{ steps.release_branch.outputs.branch_name }}"
          
          PR_BODY="## Release v${NEW_VERSION}

          **Teams affected:**
          ${{ needs.prepare-workspace.outputs.teams_affected }}

          **Changed files:**
          \`\`\`
          ${{ needs.prepare-workspace.outputs.changed_files }}
          \`\`\`

          This PR automatically bumps the version for release.
          
          **Auto-merge:** This PR will be auto-merged with admin bypass due to repository rules."
          
          PR_URL=$(gh pr create \
            --title "chore: release v${NEW_VERSION}" \
            --body "${PR_BODY}" \
            --base main \
            --head "${BRANCH_NAME}" \
            --repo "${{ github.repository }}" 2>&1)
          
          echo "pr_url=${PR_URL}" >> $GITHUB_OUTPUT
          echo "Pull Request created: ${PR_URL}"
        env:
          GH_TOKEN: ${{ steps.get-token.outputs.token }}

      - name: Auto-merge Pull Request with admin bypass
        run: |
          BRANCH_NAME="${{ steps.release_branch.outputs.branch_name }}"
          
          # Merge with admin bypass to skip required status checks
          gh pr merge "${BRANCH_NAME}" \
            --admin \
            --squash \
            --delete-branch \
            --repo "${{ github.repository }}" \
            || echo "PR merge failed, will retry in next step"
        env:
          GH_TOKEN: ${{ steps.get-token.outputs.token }}

      - name: Create GitHub Release
        id: create_release
        env:
          GITHUB_TOKEN: ${{ steps.get-token.outputs.token }}
        run: |
          gh release create "v${{ needs.prepare-workspace.outputs.new_version }}" \
            --title "Release v${{ needs.prepare-workspace.outputs.new_version }}" \
            --notes "Release v${{ needs.prepare-workspace.outputs.new_version }}

          This release includes changes to documentation.

          Teams affected: ${{ needs.prepare-workspace.outputs.teams_affected }}

          Changed files:
          ${{ needs.prepare-workspace.outputs.changed_files }}" \
            --draft=false \
            --prerelease=false


  notify-teams:
    name: Notify Teams
    needs: [prepare-workspace, create-release]
    if: needs.prepare-workspace.outputs.has_changes == 'true' && inputs.dry_run != 'true'
    runs-on: base-runner
    steps:
      - name: Send notification
        run: |
          echo "Release v${{ needs.prepare-workspace.outputs.new_version }} has been created successfully!"
          echo "Teams affected: ${{ needs.prepare-workspace.outputs.teams_affected }}"
          echo "Changes included: ${{ needs.prepare-workspace.outputs.changed_files }}"

  report-no-changes:
    name: Report No Changes
    needs: prepare-workspace
    if: needs.prepare-workspace.outputs.has_changes == 'false' && inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: No changes detected
        run: |
          echo "No changes detected in docs/ folder since last release."
          echo "Skipping release creation."

  dry-run-report:
    name: Dry Run Report
    needs: prepare-workspace
    if: inputs.dry_run == 'true'
    runs-on: base-runner
    steps:
      - name: Dry run results
        run: |
          echo "=== DRY RUN RESULTS ==="
          echo "Has changes: ${{ needs.prepare-workspace.outputs.has_changes }}"
          if [ "${{ needs.prepare-workspace.outputs.has_changes }}" == "true" ]; then
            echo "Would create version: ${{ needs.prepare-workspace.outputs.new_version }}"
            echo "Teams affected: ${{ needs.prepare-workspace.outputs.teams_affected }}"
            echo "Changed files:"
            echo "${{ needs.prepare-workspace.outputs.changed_files }}"
            echo ""
            echo "Release notes would include:"
            echo "- Teams affected: ${{ needs.prepare-workspace.outputs.teams_affected }}"
            echo "- Files changed: ${{ needs.prepare-workspace.outputs.changed_files }}"
          else
            echo "No changes detected - no release would be created"
          fi
