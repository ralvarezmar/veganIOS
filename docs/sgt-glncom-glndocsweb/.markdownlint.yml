# Example markdownlint YAML configuration with all properties set to their default value

# Default state for all rules
default: true

# Path to configuration file to extend
extends: null

MD001: false

# MD013/line-length - Line length
MD013:
  # Number of characters
  line_length: 250
  # Number of characters for headings
  heading_line_length: 140
  # Number of characters for code blocks
  code_block_line_length: 250
  # Include code blocks
  code_blocks: false
  # Include tables
  tables: false
  # Include headings
  headings: true
  # Include headings
  headers: true
  # Strict length checking
  strict: false
  # Stern length checking
  stern: false

MD006: false
  #ul-start-left: false

MD007: false
  #ul-indent: false

# MD024/no-duplicate-heading/no-duplicate-header - Multiple headings with the same content
MD024: false
  # Only check sibling headings
#  allow_different_nesting: true
  # Only check sibling headings
#  siblings_only: false

# MD026/no-trailing-punctuation - Trailing punctuation in heading
MD026:
  # Punctuation characters
  punctuation: ".,;:!。，；：！"

MD033: false

MD041: false

MD046: false

no-inline-html:
  allowed_elements: [ "details", "h1", "p", "small", "br","profile", "td", "tr", "u", "iframe", "li", "pre", "div", "span", "b", "figure", "a", "figcaption",
    "strong", "code", "tbody", "th", "thead", "col", "table", "colgroup", "ul", "em", "sup", "aside", "hr", "ol", "caption"]
